<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Toy Haven - Login</title>

    <link rel="stylesheet" href="../css/style.css">
</head>


<body>
    <header class="site-header">
        <div class="container header-inner">
            <a class="brand-wrap" href="../index.html" aria-label="Toy Haven home">

                <div class="logo-box" aria-hidden="true">
                    <img src="../assets/images/logo.png" alt="TH">
                </div>
                <span class="brand">
                    Toy Haven
                </span>
            </a>
            <button class="menu-toggle" id="menuToggle" aria-label="Open navigation menu" aria-expanded="false" aria-controls="mainNav">
                <span></span>
                <span></span>
                <span></span>
            </button>

            <nav class="main-nav" id="mainNav" aria-label="Main navigation">
                <a href="../index.html">Home</a>
                <a href="products.html">Shop</a>
                <a href="wishlist.html">Wishlist</a>
                <a href="support.html">Support</a>
            </nav>
            <div class="header-tools">

                <label class="header-search" for="globalSearch">
                    <span aria-hidden="true">⌕</span>
                    <input id="globalSearch" type="search" placeholder="Search products" aria-label="Search products">
                </label>

                <a class="cart-link" href="cart.html" aria-label="Shopping cart">
                    🛒
                    <span class="cart-count" aria-live="polite">
                        0
                    </span>
                </a>
                <a class="login-link" href="login.html" aria-label="Sign up or login">
                    Sign up / Login
                </a>
            </div>
        </div>

    </header>

    <main id="mainContent" class="auth-page">

        <section class="auth-container">

            <div class="login-section">
                <p class="auth-eyebrow">WELCOME BACK</p>
                <h1>Login</h1>

                <div class="auth-field">
                    <label for="loginEmail">Email</label>
                    <input type="email" id="loginEmail" placeholder="Enter your email">
                </div>

                <div class="auth-field">
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" placeholder="Enter your password">
                </div>

                <button type="button" id="loginBtn" class="auth-btn">Login</button>

                <p id="loginMessage" class="auth-message"></p>
            </div>

            <div class="signup-section">
                <p class="auth-eyebrow">
                    NEW TO TOY HAVEN?
                </p>
                <h2>Create Account</h2>

                <div class="auth-field">
                    <label for="signupName">Name</label>
                    <input type="text" id="signupName" placeholder="Enter your name">
                </div>

                <div class="auth-field">
                    <label for="signupEmail">Email</label>
                    <input type="email" id="signupEmail" placeholder="Enter your email">
                </div>

                <div class="auth-field">
                    <label for="signupPassword">Password</label>
                    <input type="password" id="signupPassword" placeholder="Create a password">
                </div>

                <div class="auth-field">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" placeholder="Confirm your password">
                </div>

                <button type="button" id="signupBtn" class="auth-btn">
                    Create Account
                </button>

                <p id="signupMessage" class="auth-message"></p>
            </div>

        </section>

    </main>

    <script src="../script/main.js"></script>
    <script src="../script/login.js"></script>

</body>
</html>
